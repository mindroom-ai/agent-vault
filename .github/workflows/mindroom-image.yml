name: Publish MindRoom image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mindroom-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        env:
          IMAGE: ghcr.io/mindroom-ai/agent-vault
        run: |
          created="$(git show -s --format=%cI HEAD)"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=mindroom-${GITHUB_SHA:0:12}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --build-arg "BUILD_DATE=${created}" \
            --label "org.opencontainers.image.created=${created}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            --tag "${IMAGE}:main" \
            --provenance=mode=max \
            --push \
            .

      - name: Inspect published image
        run: docker buildx imagetools inspect "ghcr.io/mindroom-ai/agent-vault:sha-${GITHUB_SHA}"
